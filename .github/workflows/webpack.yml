name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        npm install --legacy-peer-deps
        npm run build

    - name: Préparer l'archive de déploiement
      run: |
        mkdir -p dist-package
        cp -r server.ts package.json dist/ node_modules/ scripts/ dist-package/ 2>/dev/null || true

    - name: Télécharger l'artefact final
      uses: actions/upload-artifact@v4
      with:
        name: opencode-ui-intranet-ready
        path: dist-package/
